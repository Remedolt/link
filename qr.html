<style>
  :root{
    --bg:#0b0b0f; --bg-plane:#08080b; --card:#131318; --card-hover:#17171d;
    --border: rgba(255,255,255,.10); --border-strong: rgba(255,255,255,.18);
    --fg:#f5f5f7; --muted:#96969f; --muted-2:#6e6e78;
    --primary:#6d7cff; --primary-2:#9c7cff; --primary-fg:#0b0b0f; --primary-soft: rgba(109,124,255,.12);
    --success:#3ecf8e; --danger:#f2665e;
    --radius:14px;
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --font-display: "Sora", var(--font);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font); background:var(--bg); color:var(--fg);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  a{color:inherit}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px}
  header{
    position:sticky; top:0; z-index:20; backdrop-filter:blur(14px) saturate(140%);
    background:rgba(11,11,15,.7); border-bottom:1px solid var(--border);
  }
  .nav{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:13px 0}
  .nav-links{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; text-decoration:none; font-family:var(--font-display)}
  .brand .mark{
    width:32px; height:32px; border-radius:9px;
    background:linear-gradient(135deg, var(--primary), var(--primary-2));
    box-shadow:0 4px 16px -4px rgba(109,124,255,.7);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand .mark svg{width:24px; height:24px}
  .btn{
    appearance:none; border:1px solid transparent; border-radius:999px; padding:10px 18px;
    font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px; text-decoration:none;
    transition: background .15s, border-color .15s, transform .15s, box-shadow .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{
    background:linear-gradient(135deg, var(--primary), var(--primary-2)); color:#fff;
    box-shadow:0 8px 24px -10px rgba(109,124,255,.75);
  }
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 12px 28px -8px rgba(109,124,255,.85)}
  .btn-outline{background:rgba(255,255,255,.02); color:var(--fg); border-color:var(--border-strong)}
  .btn-outline:hover{background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.28)}
  .btn:disabled{opacity:.5; cursor:not-allowed}

  .hero{position:relative; overflow:hidden; padding:100px 0 76px; text-align:center}
  .hero::before{
    content:""; position:absolute; inset:0; z-index:-2;
    background-image:
      linear-gradient(to right, var(--border) 1px, transparent 1px),
      linear-gradient(to bottom, var(--border) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image: radial-gradient(ellipse 70% 55% at 50% 0%, black, transparent);
    -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 0%, black, transparent);
  }
  .glow{position:absolute; z-index:-1; border-radius:50%; filter:blur(90px); pointer-events:none}
  .glow-a{width:420px; height:420px; top:-160px; left:50%; margin-left:-560px; background:rgba(109,124,255,.35)}
  .glow-b{width:360px; height:360px; top:-120px; left:50%; margin-left:180px; background:rgba(156,124,255,.30)}

  .fade-up{opacity:0; transform:translateY(14px); animation:fadeUp .6s ease forwards}
  @keyframes fadeUp{to{opacity:1; transform:none}}

  .badge{
    display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:500;
    padding:7px 14px; border-radius:999px; background:rgba(255,255,255,.03); border:1px solid var(--border);
    color:var(--muted); margin-bottom:28px;
  }
  .badge .dot{width:6px; height:6px; border-radius:50%; background:var(--success); box-shadow:0 0 0 3px rgba(62,207,142,.18)}
  h1{
    font-family:var(--font-display); font-size:50px; line-height:1.1; letter-spacing:-.02em;
    margin:0 0 18px; font-weight:750; animation-delay:.07s;
  }
  h1 .accent{
    background:linear-gradient(100deg, var(--primary) 10%, var(--primary-2) 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .lede{font-size:18px; color:var(--muted); max-width:560px; margin:0 auto 40px; animation-delay:.14s}

  .panel{
    max-width:520px; margin:0 auto; border-radius:20px; border:1px solid var(--border-strong);
    background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 40%), rgba(17,17,22,.75);
    backdrop-filter:blur(20px);
    padding:22px; box-shadow:0 24px 70px -24px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02) inset;
    text-align:left; animation-delay:.2s;
  }
  label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:500}
  textarea{
    width:100%; min-height:88px; resize:vertical; background:rgba(255,255,255,.045);
    border:1px solid var(--border); border-radius:10px; color:var(--fg);
    font-family:inherit; font-size:14.5px; padding:12px 14px; outline:none;
    transition:border-color .15s;
  }
  textarea:focus{border-color:rgba(109,124,255,.55)}
  .field{margin-bottom:14px}
  .size-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
  .size-opt{
    flex:1; min-width:64px; text-align:center; padding:8px 10px; border-radius:8px;
    border:1px solid var(--border); font-size:13px; color:var(--muted); cursor:pointer;
    user-select:none; transition:border-color .15s, color .15s, background .15s;
  }
  .size-opt.active{border-color:var(--primary); color:var(--fg); background:var(--primary-soft)}
  .error-msg{color:var(--danger); font-size:13.5px; margin:2px 2px 12px; text-align:left}

  .result{
    max-width:520px; margin:20px auto 0; border:1px solid var(--border-strong); border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0) 40%), var(--card);
    padding:22px; display:none; text-align:center; opacity:0;
  }
  .result.show{display:block; animation:fadeUp .35s ease forwards}
  .result img{background:#fff; border-radius:12px; padding:16px; width:100%; max-width:260px; margin:0 auto 18px; display:block}
  .result-actions{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}

  footer{border-top:1px solid var(--border); padding:28px 0}
  .footer-row{text-align:center; font-size:13px; color:var(--muted-2)}
  .footer-row a{text-decoration:none; color:var(--muted-2)}
  .footer-row a:hover{color:var(--fg)}

  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--card); border:1px solid var(--border-strong); color:var(--fg);
    padding:12px 18px; border-radius:10px; font-size:13.5px; box-shadow:0 10px 30px rgba(0,0,0,.4);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (max-width:640px){
    h1{font-size:34px}
    .glow-a, .glow-b{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html" class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.9" stroke-linecap="round"><path d="M9 15a5 5 0 0 1 5-5h2M17 9a5 5 0 0 1-5 5h-2"/></svg>
      </span>
      Kısa Link
    </a>
    <div class="nav-links">
      <a href="index.html" class="btn btn-outline">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 15a5 5 0 0 1 5-5h2M17 9a5 5 0 0 1-5 5h-2"/></svg>
        Link Kısalt
      </a>
      <a href="parola.html" class="btn btn-outline">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        Parola Oluştur
      </a>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="wrap">
      <span class="badge fade-up"><span class="dot"></span> Ücretsiz, üyelik gerekmez</span>
      <h1 class="fade-up">QR Kod <span class="accent">Oluştur.</span></h1>
      <p class="lede fade-up">Bir link, metin veya herhangi bir içeriği yapıştırın; anında taranabilir bir QR kod alın.</p>

      <form class="panel fade-up" id="qrForm" onsubmit="return handleGenerate(event)" novalidate>
        <div class="field">
          <label for="qrInput">Metin veya link</label>
          <textarea id="qrInput" placeholder="https://ornek.com veya herhangi bir metin" maxlength="1000" required></textarea>
        </div>
        <div class="size-row" id="sizeRow">
          <div class="size-opt" data-size="180">180×180</div>
          <div class="size-opt active" data-size="260">260×260</div>
          <div class="size-opt" data-size="400">400×400</div>
          <div class="size-opt" data-size="600">600×600</div>
        </div>
        <p class="error-msg" id="errorMsg"></p>
        <button type="submit" class="btn btn-primary" id="qrBtn" style="width:100%; justify-content:center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2l2.4 7.2H22l-6 4.4 2.3 7.1L12 16.3 5.7 20.7 8 13.6 2 9.2h7.6z"/></svg>
          <span id="qrBtnLabel">QR Kod Oluştur</span>
        </button>
      </form>

      <div class="result" id="resultCard">
        <img id="qrImg" alt="QR kod" />
        <div class="result-actions">
          <button class="btn btn-primary" onclick="downloadQr()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>
            İndir (PNG)
          </button>
          <button class="btn btn-outline" onclick="copyQrLink()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Görsel linkini kopyala
          </button>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap footer-row">
    QR kodlar tarayıcıda anında oluşturulur, sunucuda saklanmaz.
  </div>
</footer>

<div id="toast"></div>

<script>
  var currentSize = 260;
  var currentQrUrl = '';
  var MAX_QR_TEXT_LENGTH = 1000;

  var QR_COOLDOWN_MS = 15000;
  var QR_COOLDOWN_KEY = 'kisalink_son_qr';
  var cooldownTimer = null;

  function getCooldownRemaining(){
    var last = parseInt(localStorage.getItem(QR_COOLDOWN_KEY) || '0', 10) || 0;
    return Math.max(0, QR_COOLDOWN_MS - (Date.now() - last));
  }

  function updateCooldownUI(){
    var btn = document.getElementById('qrBtn');
    var label = document.getElementById('qrBtnLabel');
    var remaining = getCooldownRemaining();
    if(remaining <= 0){
      btn.disabled = false;
      label.textContent = 'QR Kod Oluştur';
      if(cooldownTimer){ clearInterval(cooldownTimer); cooldownTimer = null; }
      return;
    }
    btn.disabled = true;
    label.textContent = Math.ceil(remaining / 1000) + 's bekleyin';
  }

  function startCooldown(){
    updateCooldownUI();
    if(!cooldownTimer && getCooldownRemaining() > 0){
      cooldownTimer = setInterval(updateCooldownUI, 250);
    }
  }
  startCooldown();

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  document.getElementById('sizeRow').addEventListener('click', function(e){
    var opt = e.target.closest('.size-opt');
    if(!opt) return;
    document.querySelectorAll('.size-opt').forEach(function(el){ el.classList.remove('active'); });
    opt.classList.add('active');
    currentSize = parseInt(opt.dataset.size, 10);
  });

  function handleGenerate(e){
    e.preventDefault();
    var errorEl = document.getElementById('errorMsg');
    errorEl.textContent = '';

    var cooldownRemaining = getCooldownRemaining();
    if(cooldownRemaining > 0){
      errorEl.textContent = 'Çok hızlı! ' + Math.ceil(cooldownRemaining / 1000) + ' saniye sonra tekrar deneyin.';
      return false;
    }

    var text = document.getElementById('qrInput').value.trim();
    if(!text){
      errorEl.textContent = 'Lütfen bir metin veya link girin.';
      return false;
    }
    if(text.length > MAX_QR_TEXT_LENGTH){
      errorEl.textContent = 'Metin çok uzun (en fazla ' + MAX_QR_TEXT_LENGTH + ' karakter olmalı).';
      return false;
    }

    currentQrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=' + currentSize + 'x' + currentSize +
      '&data=' + encodeURIComponent(text);

    var img = document.getElementById('qrImg');
    img.src = currentQrUrl;
    document.getElementById('resultCard').classList.add('show');
    localStorage.setItem(QR_COOLDOWN_KEY, String(Date.now()));
    startCooldown();
    toast('QR kod oluşturuldu');
    return false;
  }

  function downloadQr(){
    if(!currentQrUrl) return;
    fetch(currentQrUrl)
      .then(function(res){ return res.blob(); })
      .then(function(blob){
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'qr-kod.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        toast('İndiriliyor…');
      })
      .catch(function(){
        window.open(currentQrUrl, '_blank');
        toast('Doğrudan indirilemedi — görsel yeni sekmede açıldı');
      });
  }

  function copyQrLink(){
    if(!currentQrUrl) return;
    navigator.clipboard.writeText(currentQrUrl).then(function(){
      toast('Görsel linki kopyalandı');
    }).catch(function(){
      toast("Kopyalanamadı — elle kopyalayın");
    });
  }
</script>

</body>
