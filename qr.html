<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QR Kod Oluşturucu — Kısa Link</title>
<meta name="description" content="Herhangi bir metin veya linki saniyeler içinde QR koda dönüştürün ve indirin." />
<link rel="canonical" href="https://kisalink.space/qr.html" />
<meta property="og:type" content="website" />
<meta property="og:title" content="QR Kod Oluşturucu — Kısa Link" />
<meta property="og:description" content="Herhangi bir metin veya linki saniyeler içinde QR koda dönüştürün ve indirin." />
<meta property="og:url" content="https://kisalink.space/qr.html" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%236d7cff%22/><path d=%22M30 55a15 15 0 0 1 15-15h8M70 45a15 15 0 0 1-15 15h-8%22 stroke=%22white%22 stroke-width=%228%22 fill=%22none%22 stroke-linecap=%22round%22/></svg>" />
<style>
  :root{
    --bg:#0b0b0f; --bg-plane:#08080b; --card:#131318; --card-hover:#17171d;
    --border: rgba(255,255,255,.10); --border-strong: rgba(255,255,255,.16);
    --fg:#f5f5f7; --muted:#96969f; --muted-2:#6e6e78;
    --primary:#6d7cff; --primary-fg:#0b0b0f; --primary-soft: rgba(109,124,255,.12);
    --success:#3ecf8e; --danger:#f2665e;
    --radius:14px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font); background:var(--bg); color:var(--fg);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  a{color:inherit}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px}
  header{
    position:sticky; top:0; z-index:20; backdrop-filter:blur(10px);
    background:rgba(11,11,15,.75); border-bottom:1px solid var(--border);
  }
  .nav{display:flex; align-items:center; justify-content:space-between; height:64px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:600; font-size:17px; text-decoration:none}
  .brand .mark{
    width:32px; height:32px; border-radius:9px; background:var(--primary);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand .mark svg{width:16px; height:16px}
  .btn{
    appearance:none; border:1px solid transparent; border-radius:9px; padding:9px 16px;
    font-size:14px; font-weight:500; font-family:inherit; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px; text-decoration:none;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--primary); color:var(--primary-fg)}
  .btn-primary:hover{background:#8291ff}
  .btn-outline{background:transparent; color:var(--fg); border-color:var(--border-strong)}
  .btn-outline:hover{background:rgba(255,255,255,.06)}
  .btn:disabled{opacity:.5; cursor:not-allowed}

  .hero{position:relative; overflow:hidden; padding:96px 0 72px; text-align:center}
  .hero::before{
    content:""; position:absolute; inset:0; z-index:-1;
    background-image:
      linear-gradient(to right, var(--border) 1px, transparent 1px),
      linear-gradient(to bottom, var(--border) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image: radial-gradient(ellipse 70% 55% at 50% 0%, black, transparent);
    -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 0%, black, transparent);
  }
  .badge{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500;
    padding:6px 12px; border-radius:999px; background:var(--card); border:1px solid var(--border);
    color:var(--muted); margin-bottom:28px;
  }
  h1{font-size:48px; line-height:1.1; letter-spacing:-.02em; margin:0 0 18px; font-weight:650}
  h1 .accent{color:var(--primary)}
  .lede{font-size:18px; color:var(--muted); max-width:560px; margin:0 auto 40px}

  .panel{
    max-width:520px; margin:0 auto; border-radius:18px; border:1px solid var(--border);
    background:rgba(19,19,24,.7); padding:20px; box-shadow:0 20px 60px -20px rgba(0,0,0,.6);
    text-align:left;
  }
  label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:500}
  textarea{
    width:100%; min-height:88px; resize:vertical; background:rgba(255,255,255,.04);
    border:1px solid var(--border); border-radius:10px; color:var(--fg);
    font-family:inherit; font-size:14.5px; padding:12px 14px; outline:none;
  }
  textarea:focus{border-color:var(--border-strong)}
  .field{margin-bottom:14px}
  .size-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
  .size-opt{
    flex:1; min-width:64px; text-align:center; padding:8px 10px; border-radius:8px;
    border:1px solid var(--border); font-size:13px; color:var(--muted); cursor:pointer;
    user-select:none; transition:border-color .15s, color .15s, background .15s;
  }
  .size-opt.active{border-color:var(--primary); color:var(--fg); background:var(--primary-soft)}
  .error-msg{color:var(--danger); font-size:13.5px; margin:2px 2px 12px; text-align:left}

  .result{
    max-width:520px; margin:20px auto 0; border:1px solid var(--border); border-radius:14px;
    background:var(--card); padding:22px; display:none; text-align:center;
  }
  .result.show{display:block}
  .result img{background:#fff; border-radius:12px; padding:16px; width:100%; max-width:260px; margin:0 auto 18px; display:block}
  .result-actions{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}

  footer{border-top:1px solid var(--border); padding:28px 0}
  .footer-row{text-align:center; font-size:13px; color:var(--muted-2)}
  .footer-row a{text-decoration:none; color:var(--muted-2)}
  .footer-row a:hover{color:var(--fg)}

  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--card); border:1px solid var(--border-strong); color:var(--fg);
    padding:12px 18px; border-radius:10px; font-size:13.5px; box-shadow:0 10px 30px rgba(0,0,0,.4);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (max-width:640px){
    h1{font-size:32px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html" class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round"><path d="M9 15a5 5 0 0 1 5-5h2M17 9a5 5 0 0 1-5 5h-2"/></svg>
      </span>
      Kısa Link
    </a>
    <a href="index.html" class="btn btn-outline">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 15a5 5 0 0 1 5-5h2M17 9a5 5 0 0 1-5 5h-2"/></svg>
      Link Kısalt
    </a>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <span class="badge">✨ Ücretsiz, üyelik gerekmez</span>
      <h1>QR Kod <span class="accent">Oluştur.</span></h1>
      <p class="lede">Bir link, metin veya herhangi bir içeriği yapıştırın; anında taranabilir bir QR kod alın.</p>

      <form class="panel" id="qrForm" onsubmit="return handleGenerate(event)">
        <div class="field">
          <label for="qrInput">Metin veya link</label>
          <textarea id="qrInput" placeholder="https://ornek.com veya herhangi bir metin" required></textarea>
        </div>
        <div class="size-row" id="sizeRow">
          <div class="size-opt" data-size="180">180×180</div>
          <div class="size-opt active" data-size="260">260×260</div>
          <div class="size-opt" data-size="400">400×400</div>
          <div class="size-opt" data-size="600">600×600</div>
        </div>
        <p class="error-msg" id="errorMsg"></p>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2l2.4 7.2H22l-6 4.4 2.3 7.1L12 16.3 5.7 20.7 8 13.6 2 9.2h7.6z"/></svg>
          QR Kod Oluştur
        </button>
      </form>

      <div class="result" id="resultCard">
        <img id="qrImg" alt="QR kod" />
        <div class="result-actions">
          <button class="btn btn-primary" onclick="downloadQr()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>
            İndir (PNG)
          </button>
          <button class="btn btn-outline" onclick="copyQrLink()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Görsel linkini kopyala
          </button>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap footer-row">
    QR kodlar tarayıcıda anında oluşturulur, sunucuda saklanmaz.
  </div>
</footer>

<div id="toast"></div>

<script>
  var currentSize = 260;
  var currentQrUrl = '';

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  document.getElementById('sizeRow').addEventListener('click', function(e){
    var opt = e.target.closest('.size-opt');
    if(!opt) return;
    document.querySelectorAll('.size-opt').forEach(function(el){ el.classList.remove('active'); });
    opt.classList.add('active');
    currentSize = parseInt(opt.dataset.size, 10);
  });

  function handleGenerate(e){
    e.preventDefault();
    var errorEl = document.getElementById('errorMsg');
    errorEl.textContent = '';

    var text = document.getElementById('qrInput').value.trim();
    if(!text){
      errorEl.textContent = 'Lütfen bir metin veya link girin.';
      return false;
    }

    currentQrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=' + currentSize + 'x' + currentSize +
      '&data=' + encodeURIComponent(text);

    var img = document.getElementById('qrImg');
    img.src = currentQrUrl;
    document.getElementById('resultCard').classList.add('show');
    toast('QR kod oluşturuldu');
    return false;
  }

  function downloadQr(){
    if(!currentQrUrl) return;
    fetch(currentQrUrl)
      .then(function(res){ return res.blob(); })
      .then(function(blob){
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'qr-kod.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        toast('İndiriliyor…');
      })
      .catch(function(){
        window.open(currentQrUrl, '_blank');
        toast('Doğrudan indirilemedi — görsel yeni sekmede açıldı');
      });
  }

  function copyQrLink(){
    if(!currentQrUrl) return;
    navigator.clipboard.writeText(currentQrUrl).then(function(){
      toast('Görsel linki kopyalandı');
    }).catch(function(){
      toast("Kopyalanamadı — elle kopyalayın");
    });
  }
</script>

</body>
</html>
