<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kısa Link — Bitmeyen kısa linkler</title>
<meta name="description" content="Uzun URL'leri saniyeler içinde temiz, takip edilebilir kısa linklere dönüştürün." />
<link rel="canonical" href="https://kisalink.space/" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Kısa Link — Bitmeyen kısa linkler" />
<meta property="og:description" content="Uzun URL'leri saniyeler içinde temiz, takip edilebilir kısa linklere dönüştürün." />
<meta property="og:url" content="https://kisalink.space/" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%236d7cff%22/><path d=%22M30 55a15 15 0 0 1 15-15h8M70 45a15 15 0 0 1-15 15h-8%22 stroke=%22white%22 stroke-width=%228%22 fill=%22none%22 stroke-linecap=%22round%22/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0b0b0f; --bg-plane:#08080b; --card:#131318; --card-hover:#17171d;
    --border: rgba(255,255,255,.10); --border-strong: rgba(255,255,255,.18);
    --fg:#f5f5f7; --muted:#96969f; --muted-2:#6e6e78;
    --primary:#6d7cff; --primary-2:#9c7cff; --primary-fg:#0b0b0f; --primary-soft: rgba(109,124,255,.12);
    --success:#3ecf8e; --danger:#f2665e;
    --radius:14px;
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --font-display: "Sora", var(--font);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font); background:var(--bg); color:var(--fg);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  a{color:inherit}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px}
  header{
    position:sticky; top:0; z-index:20; backdrop-filter:blur(14px) saturate(140%);
    background:rgba(11,11,15,.7); border-bottom:1px solid var(--border);
  }
  .nav{display:flex; align-items:center; justify-content:space-between; height:66px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; text-decoration:none; font-family:var(--font-display)}
  .brand .mark{
    width:32px; height:32px; border-radius:9px;
    background:linear-gradient(135deg, var(--primary), var(--primary-2));
    box-shadow:0 4px 16px -4px rgba(109,124,255,.7);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand .mark svg{width:16px; height:16px}
  .btn{
    appearance:none; border:1px solid transparent; border-radius:999px; padding:10px 18px;
    font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px; text-decoration:none;
    transition: background .15s, border-color .15s, transform .15s, box-shadow .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{
    background:linear-gradient(135deg, var(--primary), var(--primary-2)); color:#fff;
    box-shadow:0 8px 24px -10px rgba(109,124,255,.75);
  }
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 12px 28px -8px rgba(109,124,255,.85)}
  .btn-outline{background:rgba(255,255,255,.02); color:var(--fg); border-color:var(--border-strong)}
  .btn-outline:hover{background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.28)}
  .btn:disabled{opacity:.5; cursor:not-allowed}

  .hero{position:relative; overflow:hidden; padding:108px 0 80px; text-align:center}
  .hero::before{
    content:""; position:absolute; inset:0; z-index:-2;
    background-image:
      linear-gradient(to right, var(--border) 1px, transparent 1px),
      linear-gradient(to bottom, var(--border) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image: radial-gradient(ellipse 70% 55% at 50% 0%, black, transparent);
    -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 0%, black, transparent);
  }
  .glow{position:absolute; z-index:-1; border-radius:50%; filter:blur(90px); pointer-events:none}
  .glow-a{width:420px; height:420px; top:-160px; left:50%; margin-left:-560px; background:rgba(109,124,255,.35)}
  .glow-b{width:360px; height:360px; top:-120px; left:50%; margin-left:180px; background:rgba(156,124,255,.30)}

  .fade-up{opacity:0; transform:translateY(14px); animation:fadeUp .6s ease forwards}
  @keyframes fadeUp{to{opacity:1; transform:none}}

  .badge{
    display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:500;
    padding:7px 14px; border-radius:999px; background:rgba(255,255,255,.03); border:1px solid var(--border);
    color:var(--muted); margin-bottom:30px; animation-delay:0s;
  }
  .badge .dot{width:6px; height:6px; border-radius:50%; background:var(--success); box-shadow:0 0 0 3px rgba(62,207,142,.18)}
  h1{
    font-family:var(--font-display); font-size:60px; line-height:1.06; letter-spacing:-.025em;
    margin:0 0 20px; font-weight:750; animation-delay:.07s;
  }
  h1 .accent{
    background:linear-gradient(100deg, var(--primary) 10%, var(--primary-2) 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .lede{font-size:18.5px; color:var(--muted); max-width:560px; margin:0 auto 42px; animation-delay:.14s}

  .shortener{
    max-width:600px; margin:0 auto; border-radius:20px; border:1px solid var(--border-strong);
    background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 40%), rgba(17,17,22,.75);
    backdrop-filter:blur(20px);
    padding:9px; box-shadow:0 24px 70px -24px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02) inset;
    text-align:left; transition:border-color .2s, box-shadow .2s; animation-delay:.2s;
  }
  .shortener:focus-within{
    border-color:rgba(109,124,255,.55);
    box-shadow:0 24px 70px -24px rgba(0,0,0,.7), 0 0 0 4px rgba(109,124,255,.16);
  }
  .shortener-row{display:flex; gap:8px; flex-wrap:wrap}
  .shortener input[type=url]{
    flex:1; min-width:200px; background:transparent; border:0; color:var(--fg);
    font-family:inherit; font-size:15.5px; padding:15px 17px; outline:none;
  }
  .shortener input::placeholder{color:var(--muted-2)}
  .alias-toggle{
    border-top:1px solid var(--border); padding:11px 15px; font-size:12.5px; color:var(--muted);
    cursor:pointer; user-select:none; display:flex; align-items:center; gap:6px;
  }
  .alias-toggle:hover{color:var(--fg)}
  .alias-row{display:none; align-items:center; gap:8px; padding:6px 15px 11px}
  .alias-row.open{display:flex}
  .alias-row span{font-size:12.5px; color:var(--muted-2); white-space:nowrap}
  .alias-row input{
    flex:1; background:rgba(255,255,255,.045); border:1px solid var(--border); border-radius:9px;
    color:var(--fg); font-family:inherit; font-size:13.5px; padding:9px 11px; outline:none;
    transition:border-color .15s;
  }
  .alias-row input:focus{border-color:rgba(109,124,255,.55)}
  .error-msg{color:var(--danger); font-size:13.5px; margin:10px 4px 0; text-align:left}

  .result{
    max-width:600px; margin:18px auto 0; border:1px solid var(--border-strong); border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0) 40%), var(--card);
    padding:18px 20px; display:none; opacity:0; transform:translateY(6px);
  }
  .result.show{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; animation:fadeUp .35s ease forwards}
  .result-info{min-width:0; display:flex; align-items:center; gap:12px}
  .result-check{
    width:32px; height:32px; border-radius:50%; flex-shrink:0; background:rgba(62,207,142,.14);
    color:var(--success); display:flex; align-items:center; justify-content:center;
  }
  .result-text{min-width:0}
  .result-orig{font-size:12px; color:var(--muted-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:320px}
  .result-link{font-size:17px; font-weight:600; color:var(--primary); text-decoration:none; word-break:break-all}
  .result-link:hover{text-decoration:underline}
  .result-actions{display:flex; gap:8px; flex-shrink:0}

  /* Bildirim */
  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--card); border:1px solid var(--border-strong); color:var(--fg);
    padding:12px 18px; border-radius:10px; font-size:13.5px; box-shadow:0 10px 30px rgba(0,0,0,.4);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (max-width:640px){
    h1{font-size:40px}
    .glow-a, .glow-b{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html" class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round"><path d="M9 15a5 5 0 0 1 5-5h2M17 9a5 5 0 0 1-5 5h-2"/></svg>
      </span>
      Kısa Link
    </a>
    <a href="qr.html" class="btn btn-outline">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h3M20 17.5V20"/></svg>
      QR Kod Oluşturucu
    </a>
  </div>
</header>

<main>
  <section class="hero">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="wrap">
      <span class="badge fade-up"><span class="dot"></span> Ücretsiz kısa linkler, üyelik gerekmez</span>
      <h1 class="fade-up">Linkleri kısalt.<br><span class="accent">Her şeyi takip et.</span></h1>
      <p class="lede fade-up">Herhangi bir URL'yi yapıştır, saniyeler içinde temiz, paylaşılabilir bir link al.</p>

      <form class="shortener fade-up" id="shortenForm" onsubmit="return handleShorten(event)">
        <div class="shortener-row">
          <input type="url" id="urlInput" placeholder="Uzun bir URL yapıştırın" required />
          <button type="submit" class="btn btn-primary" style="margin:4px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2l2.4 7.2H22l-6 4.4 2.3 7.1L12 16.3 5.7 20.7 8 13.6 2 9.2h7.6z"/></svg>
            Kısalt
          </button>
        </div>
        <div class="alias-toggle" onclick="toggleAlias()">
          <svg id="aliasChevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="transition:transform .15s"><path d="M6 9l6 6 6-6"/></svg>
          Özel takma ad (isteğe bağlı)
        </div>
        <div class="alias-row" id="aliasRow">
          <span>kisalink.space/</span>
          <input type="text" id="aliasInput" placeholder="ozel-adim" maxlength="30" pattern="[a-zA-Z0-9_-]{3,30}" />
        </div>
      </form>
      <p class="error-msg" id="errorMsg"></p>

      <div class="result" id="resultCard">
        <div class="result-info">
          <div class="result-check">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
          <div class="result-text">
            <div class="result-orig" id="resultOrig"></div>
            <a class="result-link" id="resultLink" target="_blank" rel="noopener"></a>
          </div>
        </div>
        <div class="result-actions">
          <button class="btn btn-primary" onclick="copyResult()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Kopyala
          </button>
        </div>
      </div>

    </div>
  </section>

</main>

<div id="toast"></div>

<script>
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }
  function toggleAlias(){
    var row = document.getElementById('aliasRow');
    var chev = document.getElementById('aliasChevron');
    row.classList.toggle('open');
    chev.style.transform = row.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
  }

  function isValidUrl(v){
    try{
      var u = new URL(v);
      return (u.protocol === 'http:' || u.protocol === 'https:') && u.hostname.includes('.');
    }catch(e){ return false; }
  }

  function getStore(){
    try{ return JSON.parse(localStorage.getItem('kisalink_linkler') || '{}'); }catch(e){ return {}; }
  }
  function setStore(store){
    localStorage.setItem('kisalink_linkler', JSON.stringify(store));
  }
  function randomCode(){
    var alphabet = '23456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ';
    var out = '';
    for(var i=0;i<6;i++) out += alphabet[Math.floor(Math.random()*alphabet.length)];
    return out;
  }

  var lastResultUrl = '';

  function handleShorten(e){
    e.preventDefault();
    var errorEl = document.getElementById('errorMsg');
    errorEl.textContent = '';

    var url = document.getElementById('urlInput').value.trim();
    var alias = document.getElementById('aliasInput').value.trim();

    if(!isValidUrl(url)){
      errorEl.textContent = 'Geçerli bir http(s) URL girin, örn. https://ornek.com';
      return false;
    }
    if(alias && !/^[a-zA-Z0-9_-]{3,30}$/.test(alias)){
      errorEl.textContent = 'Takma ad 3-30 karakter olmalı: yalnızca harf, rakam, - ve _';
      return false;
    }

    var store = getStore();
    var code = alias || randomCode();
    while(!alias && store[code]) code = randomCode();
    if(alias && store[code]){
      errorEl.textContent = 'Bu takma ad bu tarayıcıda zaten kullanılıyor — başka bir tane seçin.';
      return false;
    }

    store[code] = { url: url, createdAt: Date.now() };
    setStore(store);

    var shortUrl = location.origin + location.pathname.replace(/\/?$/, '/') + '#/' + code;
    lastResultUrl = shortUrl;

    document.getElementById('resultOrig').textContent = url;
    var link = document.getElementById('resultLink');
    link.href = shortUrl;
    link.textContent = shortUrl.replace(/^https?:\/\//, '');
    document.getElementById('resultCard').classList.add('show');

    document.getElementById('urlInput').value = '';
    document.getElementById('aliasInput').value = '';
    toast('Kısa link oluşturuldu');
    return false;
  }

  function copyResult(){
    navigator.clipboard.writeText(lastResultUrl).then(function(){
      toast('Panoya kopyalandı');
    }).catch(function(){
      toast("Kopyalanamadı — elle kopyalayın");
    });
  }

  // İstemci taraflı "yönlendirme": sayfa bir #/KOD hash'iyle açıldıysa,
  // bu kodu bulup tarayıcıyı hedefe yönlendirir — sadece bu tarayıcıda
  // oluşturulan linkler için çalışır (localStorage her cihaz/tarayıcıya özeldir).
  (function resolveHashRedirect(){
    var m = location.hash.match(/^#\/(.+)$/);
    if(!m) return;
    var store = getStore();
    var entry = store[m[1]];
    if(entry && entry.url){
      location.replace(entry.url);
    }
  })();
</script>

</body>
</html>
